<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainSprouts - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=20260726-2">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <header class="login-header">
                <img class="login-logo" src="/static/images/brainsprouts-logo.png" width="48" height="60">
                <h1>BrainSprouts</h1>
            </header>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Password">
                </div>
                <div id="errorMsg" class="error-msg is-hidden" role="alert"></div>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('bs_token');
        const user = JSON.parse(localStorage.getItem('bs_user'));
        if (token && user) {
            window.location.href = user.is_admin ? '/admin' : '/dashboard';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('errorMsg');
            errEl.classList.add('is-hidden');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                }),
            });
            const data = await res.json();
            if (!res.ok) {
                errEl.textContent = data.detail;
                errEl.classList.remove('is-hidden');
                return;
            }
            localStorage.setItem('bs_token', data.token);
            localStorage.setItem('bs_user', JSON.stringify(data.user));
            window.location.href = data.user.is_admin ? '/admin' : '/dashboard';
        });
    </script>
</body>
</html>
