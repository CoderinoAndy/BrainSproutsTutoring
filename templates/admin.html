<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainSprouts - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <span class="nav-brand">BrainSprouts</span>
            <span class="nav-badge">Admin</span>
        </div>
        <div class="nav-right">
            <button class="btn btn-ghost tab-btn active" data-tab="schedule" onclick="switchTab('schedule')">Schedule</button>
            <button class="btn btn-ghost tab-btn" data-tab="events" onclick="switchTab('events')">Manage Events</button>
            <button class="btn btn-ghost tab-btn" data-tab="announcements" onclick="switchTab('announcements')">Announcements</button>
            <button class="btn btn-ghost tab-btn" data-tab="users" onclick="switchTab('users')">Manage Tutors</button>
            <button class="btn btn-ghost tab-btn" data-tab="hours" onclick="switchTab('hours')">Hours</button>
            <button class="btn btn-ghost tab-btn" data-tab="roles" onclick="switchTab('roles')">Roles</button>
            <button class="btn btn-ghost" onclick="logout()">Sign Out</button>
        </div>
    </nav>

    <main class="container">
        <div id="tab-schedule" class="tab-content">
            <div class="page-header">
                <h2>Session Overview</h2>
            </div>
            <div id="adminEvents"></div>
        </div>

        <div id="tab-events" class="tab-content is-hidden">
            <div class="page-header">
                <h2>Manage Events</h2>
            </div>

            <div class="create-user-card">
                <form id="createEventForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="evTitle">Title</label>
                            <input type="text" id="evTitle" required placeholder="e.g. Tutoring Session" value="Tutoring Session">
                        </div>
                        <div class="form-group">
                            <label for="evDate">Date</label>
                            <input type="date" id="evDate" required>
                        </div>
                    </div>
                    <div class="form-row form-row-spaced">
                        <div class="form-group">
                            <label for="evStart">Start Time</label>
                            <input type="time" id="evStart" required value="16:00">
                        </div>
                        <div class="form-group">
                            <label for="evEnd">End Time</label>
                            <input type="time" id="evEnd" required value="17:00">
                        </div>
                        <div class="form-group">
                            <label for="evCapacity">Max Capacity</label>
                            <input type="number" id="evCapacity" required value="15" min="1">
                        </div>
                        <button type="submit" class="btn btn-primary btn-create">Add Event</button>
                    </div>
                </form>
                <div id="evMsg" class="msg is-hidden"></div>
            </div>

            <div id="eventList"></div>
        </div>

        <div id="tab-users" class="tab-content is-hidden">
            <div class="page-header">
                <h2>Manage Tutors</h2>
            </div>

            <div class="create-user-card">
                <form id="createUserForm" class="form-row">
                    <div class="form-group">
                        <label for="newDisplay">Display Name</label>
                        <input type="text" id="newDisplay" required placeholder="e.g. Andy Yu">
                    </div>
                    <div class="form-group">
                        <label for="newUsername">Username</label>
                        <input type="text" id="newUsername" required placeholder="e.g. AndyYuIsSoCool">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Password</label>
                        <input type="text" id="newPassword" required placeholder="Min 6 character!">
                    </div>
                    <button type="submit" class="btn btn-primary btn-create">Create Account!!</button>
                </form>
                <div id="createMsg" class="msg is-hidden"></div>
            </div>

            <div class="users-list" id="usersList"></div>
        </div>

        <div id="tab-announcements" class="tab-content is-hidden">
            <div class="page-header">
                <h2>Announcements</h2>
            </div>

            <div class="create-user-card">
                <h3>Post New Announcement</h3>
                <form id="createAnnForm">
                    <div class="form-group">
                        <label for="annTitle">Title</label>
                        <input type="text" id="annTitle" required placeholder="e.g. Schedule Change Next Week">
                    </div>
                    <div class="form-group">
                        <label for="annBody">Message</label>
                        <textarea id="annBody" required placeholder="Write your announcement here. Just cross your fingers they'll read it muahaha..." rows="4" class="textarea"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-auto-width">Post Announcement</button>
                </form>
            </div>

            <div id="annList"></div>
        </div>

        <div id="tab-hours" class="tab-content is-hidden">
            <div class="page-header">
                <h2>Hour Tracker</h2>
            </div>

            <div class="create-user-card">
                <h3>Log Hours</h3>
                <form id="logHoursForm">
                    <div class="form-row">
                        <div class="form-group form-group-tutor-select">
                            <label>Tutors</label>
                            <div class="multi-select" id="hrTutorSelect">
                                <div class="multi-select-toggle" onclick="toggleMultiSelect()">
                                    <span id="hrTutorLabel">Select tutors...</span>
                                </div>
                                <div class="multi-select-dropdown" id="hrTutorDropdown"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="hrDate">Date</label>
                            <input type="date" id="hrDate" required>
                        </div>
                        <div class="form-group">
                            <label for="hrHours">Hours</label>
                            <input type="number" id="hrHours" required min="0.25" step="0.25" placeholder="e.g. 1.5">
                        </div>
                    </div>
                    <div class="form-group form-group-spaced">
                        <label for="hrDesc">Description <span class="text-muted">(optional)</span></label>
                        <input type="text" id="hrDesc" placeholder="e.g. Tutoring session, Training, etc.">
                    </div>
                    <button type="submit" class="btn btn-primary btn-log-hours">Log Hours</button>
                </form>
                <div id="hrMsg" class="msg is-hidden"></div>
            </div>

            <div class="hours-filter">
                <label class="hours-filter-label">Filter by tutor:</label>
                <select id="hrFilter" class="select-input hours-filter-select">
                    <option value="">All Tutors</option>
                </select>
            </div>

            <div id="hoursList"></div>
        </div>

        <div id="tab-roles" class="tab-content is-hidden">
            <div class="page-header">
                <h2>Manage Roles</h2>
            </div>

            <div class="create-user-card">
                <form id="createRoleForm" class="form-row">
                    <div class="form-group">
                        <label for="newRoleName">Role Name</label>
                        <input type="text" id="newRoleName" required placeholder="e.g. Program Coordinator">
                    </div>
                    <button type="submit" class="btn btn-primary btn-create">Add Role</button>
                </form>
                <div id="roleMsg" class="msg is-hidden"></div>
            </div>

            <div id="rolesList"></div>
        </div>

    </main>

    <script>
        const token = localStorage.getItem('bs_token');
        const user = JSON.parse(localStorage.getItem('bs_user'));
        if (!token || !user || !user.is_admin) { window.location.href = '/'; }

        let cachedRoles = [];

        function formatDate(dateStr) {
            return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric',
            });
        }

        function formatTime(time) {
            return new Date(`2000-01-01T${time}`).toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
            });
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value ?? '';
            return div.innerHTML;
        }

        function showMsg(element, ok, text) {
            element.className = ok ? 'msg msg-success' : 'msg msg-error';
            element.textContent = text;
            setTimeout(() => element.classList.add('is-hidden'), 3000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('is-hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.remove('is-hidden');
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            if (tab === 'schedule') loadAdminEvents();
            if (tab === 'events') loadEventList();
            if (tab === 'users') loadUsers();
            if (tab === 'announcements') loadAnnouncements();
            if (tab === 'hours') { loadHoursTutorDropdowns(); loadHours(); }
            if (tab === 'roles') loadRoles();
        }

        async function loadAdminEvents() {
            const res = await fetch('/api/admin/events', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.status === 401 || res.status === 403) { logout(); return; }
            const events = await res.json();
            renderAdminEvents(events);
        }

        function renderAdminEvents(events) {
            const container = document.getElementById('adminEvents');
            if (events.length === 0) {
                container.innerHTML = '<p class="text-muted">No events scheduled. Go to Manage Events to add some.</p>';
                return;
            }
            const byMonth = {};
            events.forEach(ev => {
                const month = ev.date.substring(0, 7);
                if (!byMonth[month]) byMonth[month] = [];
                byMonth[month].push(ev);
            });

            let html = '';
            for (const [month, evts] of Object.entries(byMonth)) {
                const d = new Date(month + '-15');
                html += `<div class="month-section">
                    <h3 class="month-title">${d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h3>`;
                evts.forEach(ev => {
                    const isPast = new Date(ev.date + 'T23:59:59') < new Date();
                    const yesRsvps = ev.rsvps.filter(r => r.status === 'yes');
                    const maybeRsvps = ev.rsvps.filter(r => r.status === 'maybe');
                    const noRsvps = ev.rsvps.filter(r => r.status === 'no');
                    const spotsLeft = ev.max_capacity - ev.yes_count;

                    html += `
                    <div class="admin-event-card ${isPast ? 'event-past' : ''}">
                        <div class="admin-event-header">
                            <div>
                                <div class="event-date">${formatDate(ev.date)}</div>
                                <div class="event-time">${formatTime(ev.start_time)} - ${formatTime(ev.end_time)} &middot; ${ev.title}</div>
                            </div>
                            <div class="admin-counts">
                                <span class="count-badge count-yes">${ev.yes_count} Yes</span>
                                <span class="count-badge count-maybe">${ev.maybe_count} Maybe</span>
                                <span class="count-badge count-no">${ev.no_count} No</span>
                                ${ev.at_capacity ? '<span class="capacity-full">FULL</span>' : `<span class="spots-info">${spotsLeft} spots left</span>`}
                            </div>
                        </div>
                        ${ev.rsvps.length > 0 ? `
                        <div class="rsvp-details">
                            ${yesRsvps.length > 0 ? `<div class="rsvp-group">
                                <div class="rsvp-group-label status-yes-text">Attending</div>
                                ${yesRsvps.map(r => `<span class="rsvp-name">${r.display_name}</span>`).join('')}
                            </div>` : ''}
                            ${maybeRsvps.length > 0 ? `<div class="rsvp-group">
                                <div class="rsvp-group-label status-maybe-text">Maybe</div>
                                ${maybeRsvps.map(r => `<span class="rsvp-name">${r.display_name}</span>`).join('')}
                            </div>` : ''}
                            ${noRsvps.length > 0 ? `<div class="rsvp-group">
                                <div class="rsvp-group-label status-no-text">Not Attending</div>
                                ${noRsvps.map(r => `<span class="rsvp-name">${r.display_name}</span>`).join('')}
                            </div>` : ''}
                        </div>` : '<div class="rsvp-details"><span class="text-muted">No responses yet</span></div>'}
                    </div>`;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        let allEvents = [];

        async function loadEventList() {
            const res = await fetch('/api/admin/events', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            allEvents = await res.json();
            renderEventList();
        }

        function renderEventList() {
            const container = document.getElementById('eventList');
            if (allEvents.length === 0) {
                container.innerHTML = '<p class="text-muted content-empty-spaced">No events yet.</p>';
                return;
            }

            let html = '';

            html += '<h3 class="section-heading-spaced">All Events</h3><div class="users-table table-spaced-sm">';
            html += `<div class="table-header table-events">
                <span>Date</span><span>Title</span><span>Time</span><span>Capacity</span><span></span>
            </div>`;
            allEvents.forEach(ev => {
                html += `<div class="table-row table-events" id="ev-row-${ev.id}">
                    <span class="user-name">${formatDate(ev.date)}</span>
                    <span>${ev.title}</span>
                    <span class="text-muted">${formatTime(ev.start_time)} - ${formatTime(ev.end_time)}</span>
                    <span class="text-muted">${ev.yes_count}/${ev.max_capacity}</span>
                    <span class="inline-actions">
                        <button class="btn btn-danger-ghost btn-secondary-ghost" onclick="editEvent(${ev.id})">Edit</button>
                        <button class="btn btn-danger-ghost" onclick="deleteEvent(${ev.id})">Delete</button>
                    </span>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        document.getElementById('createEventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('evMsg');
            const res = await fetch('/api/admin/events', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({
                    title: document.getElementById('evTitle').value,
                    event_date: document.getElementById('evDate').value,
                    start_time: document.getElementById('evStart').value,
                    end_time: document.getElementById('evEnd').value,
                    max_capacity: parseInt(document.getElementById('evCapacity').value),
                }),
            });
            if (!res.ok) {
                msgEl.className = 'msg msg-error';
                msgEl.textContent = (await res.json()).detail;
                return;
            }
            msgEl.classList.add('is-hidden');
            document.getElementById('evDate').value = '';
            loadEventList();
        });

        function editEvent(id) {
            const ev = allEvents.find(e => e.id === id);
            const row = document.getElementById('ev-row-' + id);
            row.innerHTML = `
                <span class="user-name">${formatDate(ev.date)}</span>
                <span><input type="text" id="editEvTitle-${id}" value="${ev.title}" class="inline-edit-input inline-edit-input-full"></span>
                <span class="inline-actions">
                    <input type="time" id="editEvStart-${id}" value="${ev.start_time}" class="inline-edit-input inline-edit-input-time">
                    <input type="time" id="editEvEnd-${id}" value="${ev.end_time}" class="inline-edit-input inline-edit-input-time">
                </span>
                <span><input type="number" id="editEvCap-${id}" value="${ev.max_capacity}" min="1" class="inline-edit-input inline-edit-input-capacity"></span>
                <span class="inline-actions">
                    <button class="btn btn-danger-ghost btn-save-ghost" onclick="saveEvent(${id})">Save</button>
                    <button class="btn btn-danger-ghost btn-secondary-ghost" onclick="renderEventList()">Cancel</button>
                </span>
            `;
        }

        async function saveEvent(id) {
            await fetch(`/api/admin/events/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({
                    title: document.getElementById('editEvTitle-' + id).value,
                    start_time: document.getElementById('editEvStart-' + id).value,
                    end_time: document.getElementById('editEvEnd-' + id).value,
                    max_capacity: parseInt(document.getElementById('editEvCap-' + id).value),
                }),
            });
            loadEventList();
        }

        async function deleteEvent(id) {
            await fetch(`/api/admin/events/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token },
            });
            loadEventList();
        }

        async function fetchRoles() {
            const res = await fetch('/api/roles', {
                headers: { 'Authorization': 'Bearer ' + token },
            });
            if (res.status === 401 || res.status === 403) { logout(); return []; }
            cachedRoles = await res.json();
            return cachedRoles;
        }

        async function loadUsers() {
            const [usersRes] = await Promise.all([
                fetch('/api/admin/users', {
                    headers: { 'Authorization': 'Bearer ' + token },
                }),
                fetchRoles(),
            ]);
            const users = await usersRes.json();
            const list = document.getElementById('usersList');
            let html = '<h3>Current Tutors</h3><div class="users-table">';
            html += `<div class="table-header table-5col">
                <span>Name</span><span>Username</span><span>Executive Title</span><span>Created</span><span></span>
            </div>`;
            users.forEach(u => {
                const availableRoles = cachedRoles.some(role => role.name === u.executive_title)
                    ? cachedRoles
                    : [{ id: null, name: u.executive_title || 'Jr. Tutor' }, ...cachedRoles];
                const titleSelect = !u.is_admin ? `<select class="select-input select-input-compact" onchange="updateTitle(${u.id}, this.value)">
                    ${availableRoles.map(role => `<option value="${escapeHtml(role.name)}" ${u.executive_title === role.name ? 'selected' : ''}>${escapeHtml(role.name)}</option>`).join('')}
                    </select>` : '';
                html += `<div class="table-row table-5col">
                    <span class="user-name">${escapeHtml(u.display_name)} ${u.is_admin ? '<span class="nav-badge">Admin</span>' : ''}</span>
                    <span class="text-muted">${escapeHtml(u.username)}</span>
                    <span>${titleSelect}</span>
                    <span class="text-muted">${String(u.created_at).split(/[ T]/)[0]}</span>
                    <span>${!u.is_admin ? `<button class="btn btn-danger-ghost" onclick="deleteUser(${u.id})">Remove</button>` : ''}</span>
                </div>`;
            });
            html += '</div>';
            list.innerHTML = html;
        }

        async function updateTitle(userId, title) {
            await fetch(`/api/admin/users/${userId}/title`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ executive_title: title }),
            });
        }

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('createMsg');
            const res = await fetch('/api/admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({
                    display_name: document.getElementById('newDisplay').value,
                    username: document.getElementById('newUsername').value,
                    password: document.getElementById('newPassword').value,
                }),
            });
            if (!res.ok) {
                msgEl.className = 'msg msg-error';
                msgEl.textContent = (await res.json()).detail;
                return;
            }
            msgEl.classList.add('is-hidden');
            document.getElementById('createUserForm').reset();
            loadUsers();
        });

        async function deleteUser(id) {
            await fetch(`/api/admin/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token },
            });
            loadUsers();
        }

        async function loadAnnouncements() {
            const res = await fetch('/api/announcements', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const anns = await res.json();
            const container = document.getElementById('annList');
            if (anns.length === 0) {
                container.innerHTML = '<p class="text-muted content-empty-spaced">No announcements yet.</p>';
                return;
            }
            let html = '<h3 class="announcement-heading-spaced">Previous Announcements</h3>';
            anns.forEach(a => {
                const date = new Date(a.created_at + 'Z');
                const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                html += `<div class="announcement-card announcement-card-spaced">
                    <div class="ann-header">
                        <span class="ann-title">${a.title}</span>
                        <div class="announcement-meta-actions">
                            <span class="ann-date">${dateStr}</span>
                            <button class="btn btn-danger-ghost" onclick="deleteAnnouncement(${a.id})">Delete</button>
                        </div>
                    </div>
                    <p class="ann-body">${a.body}</p>
                </div>`;
            });
            container.innerHTML = html;
        }

        document.getElementById('createAnnForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/admin/announcements', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({
                    title: document.getElementById('annTitle').value,
                    body: document.getElementById('annBody').value,
                }),
            });
            document.getElementById('createAnnForm').reset();
            loadAnnouncements();
        });

        async function deleteAnnouncement(id) {
            await fetch(`/api/admin/announcements/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token },
            });
            loadAnnouncements();
        }

        let allHours = [];

        let hrSelectedTutors = new Set();

        function toggleMultiSelect() {
            const dd = document.getElementById('hrTutorDropdown');
            dd.classList.toggle('open');
        }

        document.addEventListener('click', (e) => {
            const sel = document.getElementById('hrTutorSelect');
            if (!sel.contains(e.target)) {
                document.getElementById('hrTutorDropdown').classList.remove('open');
            }
        });

        function toggleTutor(id) {
            if (hrSelectedTutors.has(id)) hrSelectedTutors.delete(id);
            else hrSelectedTutors.add(id);
            updateTutorLabel();
        }

        function updateTutorLabel() {
            const label = document.getElementById('hrTutorLabel');
            if (hrSelectedTutors.size === 0) label.textContent = 'Select tutors...';
            else label.textContent = hrSelectedTutors.size + ' tutor' + (hrSelectedTutors.size !== 1 ? 's' : '') + ' selected';
        }

        function selectAllTutors() {
            const dd = document.getElementById('hrTutorDropdown');
            const cbs = dd.querySelectorAll('input[type=checkbox]');
            const allSelected = hrSelectedTutors.size === cbs.length;
            if (allSelected) {
                hrSelectedTutors.clear();
                cbs.forEach(cb => cb.checked = false);
            } else {
                cbs.forEach(cb => { cb.checked = true; hrSelectedTutors.add(parseInt(cb.value)); });
            }
            updateTutorLabel();
        }

        async function loadHoursTutorDropdowns() {
            const res = await fetch('/api/admin/users', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const users = await res.json();
            const tutors = users.filter(u => !u.is_admin);
            const dd = document.getElementById('hrTutorDropdown');
            const filt = document.getElementById('hrFilter');
            const curFilt = filt.value;

            dd.innerHTML = `<label class="multi-select-item" onclick="selectAllTutors()">
                <span class="select-all-label">Select All</span>
            </label>`;
            tutors.forEach(u => {
                dd.innerHTML += `<label class="multi-select-item">
                    <input type="checkbox" value="${u.id}" ${hrSelectedTutors.has(u.id) ? 'checked' : ''} onchange="toggleTutor(${u.id})">
                    <span>${u.display_name}</span>
                </label>`;
            });

            filt.innerHTML = '<option value="">All Tutors</option>';
            tutors.forEach(u => {
                filt.innerHTML += `<option value="${u.id}">${u.display_name}</option>`;
            });
            filt.value = curFilt;
        }

        async function loadHours() {
            const res = await fetch('/api/admin/hours', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            allHours = await res.json();
            renderHours();
        }

        function renderHours() {
            const filter = document.getElementById('hrFilter').value;
            const filtered = filter ? allHours.filter(h => String(h.user_id) === filter) : allHours;
            const container = document.getElementById('hoursList');

            const totalHours = filtered.reduce((sum, h) => sum + h.hours, 0);

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-muted">No hours logged yet.</p>';
                return;
            }

            let html = `<div class="hours-summary">
                <span class="hours-total-label">Total Hours:</span>
                <span class="hours-total-value">${totalHours.toFixed(1)}</span>
            </div>`;

            html += '<div class="users-table table-spaced"><div class="table-header table-hours">';
            html += '<span>Tutor</span><span>Date</span><span>Hours</span><span>Description</span><span></span>';
            html += '</div>';

            filtered.forEach(h => {
                html += `<div class="table-row table-hours" id="hour-row-${h.id}">
                    <span class="user-name">${h.display_name}</span>
                    <span>${formatDate(h.work_date)}</span>
                    <span>${h.hours}</span>
                    <span class="text-muted">${h.description || '—'}</span>
                    <span class="inline-actions">
                        <button class="btn btn-danger-ghost btn-secondary-ghost" onclick="editHour(${h.id})">Edit</button>
                        <button class="btn btn-danger-ghost" onclick="deleteHour(${h.id})">Delete</button>
                    </span>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        document.getElementById('hrFilter').addEventListener('change', renderHours);

        document.getElementById('logHoursForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('hrMsg');
            if (hrSelectedTutors.size === 0) {
                msgEl.className = 'msg msg-error';
                msgEl.textContent = 'Please select at least one tutor';
                return;
            }
            msgEl.classList.add('is-hidden');
            await fetch('/api/admin/hours', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({
                    user_ids: Array.from(hrSelectedTutors),
                    work_date: document.getElementById('hrDate').value,
                    hours: parseFloat(document.getElementById('hrHours').value),
                    description: document.getElementById('hrDesc').value,
                }),
            });
            document.getElementById('logHoursForm').reset();
            hrSelectedTutors.clear();
            updateTutorLabel();
            loadHours();
        });

        function editHour(id) {
            const h = allHours.find(x => x.id === id);
            const row = document.getElementById('hour-row-' + id);
            row.innerHTML = `
                <span class="user-name">${h.display_name}</span>
                <span><input type="date" id="editDate-${id}" value="${h.work_date}" class="inline-edit-input"></span>
                <span><input type="number" id="editHours-${id}" value="${h.hours}" min="0.25" step="0.25" class="inline-edit-input inline-edit-input-hours"></span>
                <span><input type="text" id="editDesc-${id}" value="${h.description || ''}" class="inline-edit-input inline-edit-input-full"></span>
                <span class="inline-actions">
                    <button class="btn btn-danger-ghost btn-save-ghost" onclick="saveHour(${id})">Save</button>
                    <button class="btn btn-danger-ghost btn-secondary-ghost" onclick="renderHours()">Cancel</button>
                </span>
            `;
        }

        async function saveHour(id) {
            await fetch(`/api/admin/hours/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({
                    work_date: document.getElementById('editDate-' + id).value,
                    hours: parseFloat(document.getElementById('editHours-' + id).value),
                    description: document.getElementById('editDesc-' + id).value,
                }),
            });
            loadHours();
        }

        async function deleteHour(id) {
            await fetch(`/api/admin/hours/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token },
            });
            loadHours();
        }

        async function loadRoles() {
            await fetchRoles();
            const container = document.getElementById('rolesList');
            if (cachedRoles.length === 0) {
                container.innerHTML = '<p class="text-muted">No roles defined yet.</p>';
                return;
            }
            let html = '<div class="roles-list">';
            cachedRoles.forEach((role) => {
                const isDefault = role.name === 'Jr. Tutor';
                html += `<div class="role-item">
                    <span class="role-name">${escapeHtml(role.name)}</span>
                    <button class="btn btn-danger-ghost" ${isDefault ? 'disabled title="Default role cannot be deleted"' : `onclick="deleteRole(${role.id})"`}>Delete</button>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        async function deleteRole(id) {
            const role = cachedRoles.find(item => item.id === id);
            if (!role || !confirm(`Delete the "${role.name}" role? Tutors with this role will be reset to "Jr. Tutor".`)) return;
            const res = await fetch(`/api/admin/roles/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token },
            });
            if (!res.ok) {
                alert((await res.json()).detail || 'Failed to delete role');
                return;
            }
            await loadRoles();
        }

        document.getElementById('createRoleForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const msgEl = document.getElementById('roleMsg');
            const res = await fetch('/api/admin/roles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ name: document.getElementById('newRoleName').value }),
            });
            const data = await res.json().catch(() => ({}));
            showMsg(msgEl, res.ok, res.ok ? 'Role created!' : (data.detail || 'Failed to create role'));
            if (res.ok) {
                document.getElementById('newRoleName').value = '';
                await loadRoles();
            }
        });

        function logout() {
            localStorage.removeItem('bs_token');
            localStorage.removeItem('bs_user');
            window.location.href = '/';
        }

        loadAdminEvents();
    </script>
</body>
</html>
